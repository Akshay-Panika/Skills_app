name: skills_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.1
  lottie: ^3.3.1
  shared_preferences: ^2.5.3
  get: ^4.7.3
  fluttertoast: ^9.0.0
  dio: ^5.9.2
  font_awesome_flutter: ^11.0.0
  file_picker: ^10.3.10
  geolocator: ^14.0.2
  geocoding: ^2.1.0
  shimmer: ^3.0.0
  google_maps_flutter: ^2.5.0
  web_socket_channel: ^3.0.3
  url_launcher: ^6.1.10
  sms_autofill: ^2.4.1
  transparent_image: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7


# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app/skills-app.png"
  web:
    generate: true
    name: "Skills App"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app/skills-app.png"

# Splash Screen Configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/app/skills-app.png"
  android_12:
    image: "assets/app/skills-app.png"
    color: "#FFFFFF"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/app/
    - assets/image/
    - assets/intro/